name: Build and Publish to GHCR

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ${{ github.repository_owner }}/proposal-autopilot-backend
  IMAGE_FRONTEND: ${{ github.repository_owner }}/proposal-autopilot-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    # PostgreSQL de prueba efímero para validar migraciones y schema drift
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: drift_check_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      # 🛡️ ADUANA CRÍTICA DE BASE DE DATOS: Previene desalineación de columnas y migraciones rotas
      - name: Verify Prisma Migrations & Schema Drift Guard
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/drift_check_db?schema=public
        run: |
          npm ci
          echo "============================================================"
          echo "📦 [1/2] Aplicando todas las migraciones en base limpia..."
          echo "============================================================"
          npx prisma migrate deploy

          echo "============================================================"
          echo "🛡️ [2/2] Verificando Schema Drift (columnas y tablas faltantes)..."
          echo "============================================================"
          DIFF=$(npx prisma migrate diff \
            --from-schema-datasource prisma/schema.prisma \
            --to-schema-datamodel prisma/schema.prisma) || true

          echo "$DIFF"

          # Detectar si hay columnas o tablas añadidas o eliminadas en schema.prisma sin migración SQL
          if echo "$DIFF" | grep -Ei "Added (column|table)|Drop (column|table)"; then
            echo ""
            echo "🚨 ERROR CRÍTICO DE SCHEMA DRIFT DETECTADO:"
            echo "   Has modificado columnas o tablas en 'schema.prisma' sin crear su migración SQL en 'prisma/migrations'."
            echo "   Esto rompería producción. Ejecuta: 'npx prisma migrate dev --create-only --name <nombre>' antes de desplegar."
            exit 1
          fi

          echo "✅ Aduana superada: No hay columnas ni tablas desalineadas entre el código y las migraciones."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase Image Names
        run: |
          echo "IMAGE_BACKEND_LOWER=$(echo ${{ env.IMAGE_BACKEND }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "IMAGE_FRONTEND_LOWER=$(echo ${{ env.IMAGE_FRONTEND }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # 1. Build and Push Backend
      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND_LOWER }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND_LOWER }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2. Build and Push Frontend
      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND_LOWER }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND_LOWER }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
