services:
  postgres:
    image: postgres:16-alpine
    container_name: proposal_autopilot_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: proposal_autopilot_db
    ports:
      - '5438:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d proposal_autopilot_db']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: proposal_autopilot_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '7000:7000'
    networks:
      default:
        aliases:
          - pepper-tix_proposal-backend
          - proposal_autopilot_backend
    environment:
      PORT: 7000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/proposal_autopilot_db?schema=public
    env_file:
      - ./backend/.env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: proposal_autopilot_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '7001:80'

volumes:
  postgres_data:
    name: proposal_autopilot_postgres_data
