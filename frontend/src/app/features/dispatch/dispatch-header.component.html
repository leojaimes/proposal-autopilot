<header class="h-14 border-b border-border-subtle bg-surface px-6 flex items-center justify-between flex-shrink-0 select-none">
  <!-- Brand & Live Indicator -->
  <div class="flex items-center gap-3">
    <div class="w-8 h-8 rounded-xl bg-brand-primary flex items-center justify-center text-white font-black text-sm shadow-md">
      ⚡
    </div>
    <div>
      <span class="font-bold text-sm tracking-tight text-content-primary">Proposal Autopilot</span>
      <span class="text-[11px] text-content-muted ml-2 font-mono">Cabina de Despacho</span>
    </div>
    <span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[10px] font-mono text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 ml-2">
      <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
      Motor Activo
    </span>
  </div>

  <!-- Quick Actions -->
  <div class="flex items-center gap-3">
    <!-- Run Morning Scrape -->
    <button (click)="report.triggerLiveScrape(25)"
            [disabled]="report.isScrapingInProgress()"
            class="flex items-center gap-2 px-3.5 py-1.5 text-xs font-bold rounded-xl bg-brand-primary hover:bg-brand-hover text-white transition-all shadow-sm disabled:opacity-50">
      @if (report.isScrapingInProgress()) {
        <svg class="w-3.5 h-3.5 animate-spin" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
        </svg>
        <span>Scrapeando 25 empleos...</span>
      } @else {
        <span>⚡ Scrapear Ahora</span>
      }
    </button>

    <!-- Export CSV -->
    <button (click)="report.downloadCsv()"
            class="flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium rounded-xl bg-surface-elevated hover:bg-surface-hover text-content-secondary border border-border-subtle transition-all">
      <span>Exportar CSV</span>
    </button>

    <!-- Engine Settings Button -->
    <button (click)="openSettings.emit()"
            class="flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold rounded-xl bg-surface-elevated hover:bg-surface-hover text-content-primary border border-border-subtle transition-all"
            title="Abrir Calibrador del Motor">
      <span>⚙️ Calibrar</span>
    </button>

    <!-- Theme Toggle -->
    <button (click)="theme.toggleTheme()"
            class="p-2 rounded-xl bg-surface-elevated hover:bg-surface-hover text-content-secondary border border-border-subtle transition-all"
            title="Cambiar Tema Claro / Oscuro">
      @if (theme.theme() === 'dark') {
        <svg class="w-4 h-4 text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
        </svg>
      } @else {
        <svg class="w-4 h-4 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
        </svg>
      }
    </button>
  </div>
</header>
