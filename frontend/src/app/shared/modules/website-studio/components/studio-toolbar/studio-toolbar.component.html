<header class="h-14 bg-slate-950 border-b border-slate-800 px-4 flex items-center justify-between text-slate-100 select-none z-20">
  <!-- Left: Google AI Studio Branding & Model Pill -->
  <div class="flex items-center gap-3">
    <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-blue-600 via-indigo-600 to-purple-500 flex items-center justify-center font-bold text-white text-sm shadow-md ring-1 ring-white/20">
      ✨
    </div>

    <div>
      <div class="flex items-center gap-2">
        <h2 class="text-xs sm:text-sm font-bold text-white tracking-tight flex items-center gap-1.5">
          <span>{{ state.session()?.demo?.businessName || 'Editor Visual' }}</span>
          <span class="text-slate-500 font-normal">/</span>
          <span class="text-slate-400 font-mono text-[11px] font-normal">Astro Workbench</span>
        </h2>
        <span class="text-[10px] px-2 py-0.5 rounded-full bg-slate-800/80 text-cyan-400 font-mono border border-cyan-500/20">
          {{ state.session()?.demo?.vertical || 'general' }}
        </span>
      </div>
      <div class="flex items-center gap-2 text-[10px] text-slate-400 font-mono">
        <span class="truncate max-w-[140px] sm:max-w-xs">slug: {{ state.demoSlug() }}</span>
        <span class="text-slate-600">•</span>
        <!-- Google AI Studio Model Badge -->
        <span class="inline-flex items-center gap-1 text-emerald-400 bg-emerald-950/40 px-1.5 py-0.2 rounded border border-emerald-500/30">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
          <span>gemini-3-flash-preview</span>
        </span>
      </div>
    </div>
  </div>

  <!-- Center: View Switcher (Preview vs Astro Code) & Device Selector -->
  <div class="flex items-center gap-2">
    <!-- View Switcher -->
    <div class="flex items-center bg-slate-900 border border-slate-800 rounded-xl p-1 gap-1">
      <button
        (click)="setViewMode('preview')"
        class="px-3 py-1 text-xs font-semibold rounded-lg transition-all flex items-center gap-1.5"
        [ngClass]="state.viewMode() === 'preview' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-400 hover:text-white'"
        title="Ver Página Renderizada en Vivo"
      >
        <span>👁️</span>
        <span class="hidden md:inline">Vista Previa</span>
      </button>

      <button
        (click)="setViewMode('code')"
        class="px-3 py-1 text-xs font-semibold rounded-lg transition-all flex items-center gap-1.5"
        [ngClass]="state.viewMode() === 'code' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-400 hover:text-white'"
        title="Ver Código Fuente de Componentes Astro"
      >
        <span>&lt;/&gt;</span>
        <span class="hidden md:inline">Código Astro</span>
      </button>
    </div>

    <!-- Device Mode Switcher (Desktop / Mobile) -->
    <div class="flex items-center bg-slate-900 border border-slate-800 rounded-xl p-1 gap-1">
      <button
        (click)="setDevice('desktop')"
        class="px-2.5 py-1 text-xs font-semibold rounded-lg transition-all flex items-center gap-1"
        [ngClass]="state.deviceMode() === 'desktop' ? 'bg-slate-800 text-white shadow-sm' : 'text-slate-400 hover:text-white'"
        title="Vista Escritorio (100% Ancho)"
      >
        <span>🖥️</span>
      </button>

      <button
        (click)="setDevice('mobile')"
        class="px-2.5 py-1 text-xs font-semibold rounded-lg transition-all flex items-center gap-1"
        [ngClass]="state.deviceMode() === 'mobile' ? 'bg-slate-800 text-white shadow-sm' : 'text-slate-400 hover:text-white'"
        title="Vista Móvil (375px)"
      >
        <span>📱</span>
      </button>
    </div>
  </div>

  <!-- Right: Status, Export, Publish & Exit -->
  <div class="flex items-center gap-2 sm:gap-3">
    <!-- Revision Badge -->
    <div class="hidden lg:flex items-center gap-1.5 text-xs text-slate-400">
      <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
      <span class="font-mono">Rev #{{ state.currentRevisionNumber() }}</span>
    </div>

    <!-- Export Astro Button -->
    <button
      (click)="onExportAstro()"
      class="px-3 py-1.5 rounded-xl text-xs font-bold text-slate-200 bg-slate-800/80 hover:bg-slate-700 hover:text-white border border-slate-700 transition-all flex items-center gap-1.5 shadow-sm"
      title="Descargar paquete completo del proyecto Astro 5 (.zip)"
    >
      <span>⚡</span>
      <span class="hidden sm:inline">Exportar Astro</span>
    </button>

    <!-- Snapshot / Publish CTA -->
    <button
      (click)="onPublish()"
      [disabled]="state.isPublishing()"
      class="px-3.5 py-1.5 rounded-xl text-xs font-bold text-white bg-gradient-to-r from-emerald-600 to-teal-500 hover:from-emerald-500 hover:to-teal-400 shadow-md transition-all flex items-center gap-1.5 disabled:opacity-50"
    >
      @if (state.isPublishing()) {
        <span class="w-3.5 h-3.5 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
        <span>Renderizando...</span>
      } @else {
        <span>📸 Publicar</span>
      }
    </button>

    <!-- Close Editor Button -->
    <button
      (click)="close.emit()"
      class="p-2 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 transition-colors"
      title="Cerrar Editor"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>
</header>
