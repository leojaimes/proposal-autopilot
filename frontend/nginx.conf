server {
    listen 80;
    server_name localhost;
    client_max_body_size 25M;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://pepper-tix_proposal-backend:7000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;

        # W3C Distributed Tracing & SRE Correlation Headers
        proxy_set_header X-Request-Id $http_x_request_id;
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 413 /error_413.json;
    location = /error_413.json {
        internal;
        default_type application/json;
        return 413 '{"error":"Payload Too Large","status":413,"code":"PAYLOAD_TOO_LARGE","message":"The uploaded file or request body exceeds the maximum permitted size of 25MB."}';
    }

    error_page 500 502 503 504 /error_50x.json;
    location = /error_50x.json {
        internal;
        default_type application/json;
        return 502 '{"error":"Bad Gateway or Upstream Failure","status":502,"code":"INGRESS_ERROR","message":"The upstream service is temporarily unavailable or restarting."}';
    }
}
